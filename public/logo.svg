<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" fill="none">
  <defs>
    <linearGradient id="logoCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="55%" stop-color="#0b6bcb" />
      <stop offset="100%" stop-color="#0755a5" />
    </linearGradient>
    <linearGradient id="logoCheckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="logoGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#072d5c" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Brand Icon Group (Left, 120x120) -->
  <g transform="translate(20, 20)">
    <!-- Squircle Background -->
    <rect width="120" height="120" rx="32" fill="url(#logoCardBg)" />
    <rect x="3" y="3" width="114" height="114" rx="29" fill="none" stroke="url(#logoGlow)" stroke-width="2" />

    <!-- Briefcase Symbol -->
    <g transform="translate(18, 14) scale(0.18)" filter="url(#logoShadow)">
      <!-- Handle -->
      <path d="M194 150 C194 122 216 98 244 98 L268 98 C296 98 318 122 318 150 L318 174 L194 174 Z" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Body -->
      <rect x="92" y="170" width="328" height="240" rx="44" fill="#ffffff" />
      <!-- Seam -->
      <path d="M92 232 L212 232 C222 232 230 240 230 250 C230 260 238 268 248 268 L264 268 C274 268 282 260 282 250 C282 240 290 232 300 232 L420 232" fill="none" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round" />
      <!-- Monogram Badge -->
      <circle cx="256" cy="316" r="56" fill="url(#logoCardBg)" />
      <rect x="230" y="290" width="12" height="52" rx="6" fill="#ffffff" />
      <path d="M239 316 L273 288" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
      <path d="M239 316 L276 344" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
      <!-- Checkmark -->
      <circle cx="388" cy="174" r="32" fill="url(#logoCheckGrad)" stroke="#ffffff" stroke-width="8" />
      <path d="M374 174 L384 184 L402 164" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Brand Typography -->
  <!-- Main Name: Info Loker Kita -->
  <text x="160" y="82" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#0f172a" letter-spacing="-1.5">Info Loker <tspan fill="#0b6bcb" font-weight="900">Kita</tspan></text>

  <!-- Tagline / Subtitle -->
  <text x="162" y="114" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#64748b" letter-spacing="1.8">PORTAL LOWONGAN KERJA RESMI INDONESIA</text>

  <!-- Trust Tag / Pill Badge -->
  <g transform="translate(528, 54)">
    <rect width="132" height="30" rx="15" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="66" y="20" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">✓ 100% BEBAS BIAYA</text>
  </g>
</svg>
