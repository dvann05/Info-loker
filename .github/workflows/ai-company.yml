name: InfoLokerKita AI Company Autonomous Runner

on:
  schedule:
    # 05:00 WIB = 22:00 UTC (Siklus Rekrutmen & Kurasi Lowongan)
    - cron: "0 22 * * *"
    # 07:00 WIB = 00:00 UTC (Siklus Redaksi Berita & Thumbnail)
    - cron: "0 0 * * *"
    # 08:00 WIB = 01:00 UTC (Siklus Pengarsipan, Audit, & Laporan Harian CEO)
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      cycle:
        description: "Pilih siklus otomasi yang ingin dijalankan"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - "0500"
          - "0700"
          - "0800"

permissions:
  contents: write

concurrency:
  group: ai-company-runner
  cancel-in-progress: false

jobs:
  run-ai-company:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Automation Cycle
        id: resolve_cycle
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.cycle }}" ]; then
            CYCLE="${{ github.event.inputs.cycle }}"
          else
            case "${{ github.event.schedule }}" in
              "0 22 * * *") CYCLE="0500" ;;
              "0 0 * * *")  CYCLE="0700" ;;
              "0 1 * * *")  CYCLE="0800" ;;
              *)            CYCLE="all"  ;;
            esac
          fi
          echo "cycle=$CYCLE" >> "$GITHUB_OUTPUT"
          echo "Menjalankan siklus AI Company: $CYCLE"

      - name: Run AI Company Operations
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m automation.ai_company.publish_single_article --sync-staged
          python -m automation.ai_company.cli run "${{ steps.resolve_cycle.outputs.cycle }}"

      - name: Commit & Push New Thumbnails and Reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images/berita/ automation/ai_company/reports/
          if git diff --staged --quiet; then
            echo "Tidak ada thumbnail atau laporan baru untuk di-commit."
          else
            git commit -m "feat(assets): auto-sync AI news thumbnails and daily report [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

  deploy-website:
    needs: run-ai-company
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
