name: InfoLokerKita AI Company Autonomous Runner

on:
  schedule:
    # 05:00 WIB = 22:00 UTC (Siklus Rekrutmen & Kurasi Lowongan)
    - cron: "0 22 * * *"
    # 07:00 WIB = 00:00 UTC (Siklus Redaksi Berita & Thumbnail)
    - cron: "0 0 * * *"
    # 08:00 WIB = 01:00 UTC (Siklus Audit & Laporan Harian CEO)
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Pilih siklus otomasi yang ingin dijalankan'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - '0500'
          - '0700'
          - '0800'

permissions:
  contents: write

jobs:
  run-ai-company:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Company Operations
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m automation.ai_company.publish_single_article --sync-staged
          CYCLE="${{ github.event.inputs.cycle }}"
          if [ -z "$CYCLE" ]; then
            CYCLE="all"
          fi
          python -m automation.ai_company.cli run "$CYCLE"

      - name: Commit & Push New Thumbnails and Reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images/berita/*.svg automation/ai_company/reports/
          if git diff --staged --quiet; then
            echo "Tidak ada thumbnail atau laporan baru untuk di-commit."
          else
            git commit -m "feat(assets): auto-sync AI news thumbnails and daily report [skip ci]"
            git push origin main
          fi

  deploy-to-cloudflare:
    needs: run-ai-company
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare
        run: npx wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
