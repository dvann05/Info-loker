name: Build and Deploy InfoLoker

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "automation/logs/**"
      - "automation/ai_company/reports/**"
  workflow_dispatch:
    inputs:
      run_karirhub_import:
        description: "Jalankan impor Karirhub sebelum deploy"
        required: false
        default: false
        type: boolean
  workflow_call:
  schedule:
    # 05:30 WIB = 22:30 UTC (Impor harian Karirhub + arsip kedaluwarsa, dilanjutkan deploy)
    - cron: "30 22 * * *"

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  import-karirhub:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_karirhub_import == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import lowongan Karirhub & arsipkan kedaluwarsa
        run: python automation/sources/karirhub_import.py
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  deploy:
    needs: [import-karirhub]
    if: >-
      always() &&
      (needs.import-karirhub.result == 'success' || needs.import-karirhub.result == 'skipped') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare
        run: npx wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
